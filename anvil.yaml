metadata:
  description: Pin a picture to your real wall with your Quest headset, put the controllers down and trace it with a pencil.
    Hide it with one button to check your lines.
  logo_img: asset:icon-512.png
  title: 'WallTracer: trace any picture onto your wall in VR'
name: WallTracer
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=e95389c099\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#efe9e1\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..800,0..100,0..1&family=Inter:wght@400;500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=dbb62f9d6b\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=dbb62f9d6b\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: the footer's \"Suggest an idea\" link (data-prepsto-open) slides it in.\
    \ No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n<script src=\"\
    https://prepsto.com/_/theme/widget.js\" data-prepsto=\"4rxd8g8\" data-button=\"false\" data-label=\"Suggest an idea\"\
    \ async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=0802ec357e\">\n<script src=\"_/theme/app.js?v=e8df890df7\"\
    ></script>\n"
package_name: WallTracer
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
