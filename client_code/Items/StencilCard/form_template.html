<div class="lb-card-wrap">
  <button type="button" class="lb-card" anvil:name="card" anvil:on-dom:click="self.card_click">
    <span class="pic" anvil:name="pic_box"><img anvil:name="pic" alt="" loading="lazy"><span anvil:name="letter_art" class="lb-aa" aria-hidden="true">Aa</span></span>
    <span class="lb-title" anvil:dom-node="title"></span>
    <span class="meta">
      <span class="ui-badge" anvil:name="level"></span>
      <span class="ui-badge" anvil:dom-node="width"></span>
      <span class="ui-badge" anvil:name="uses_badge"><i class="ic ic-heart" aria-hidden="true"></i><span anvil:dom-node="uses"></span></span>
    </span>
  </button>
</div>
